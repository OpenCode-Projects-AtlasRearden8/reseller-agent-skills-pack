[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reseller-skills-pack"
version = "0.1.0"
description = "Plain-English agent skills for reselling side hustles: condition grading, honest listings, price floors, shipping classes, red-flag buyer asks, and month-end profit recaps."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Asdale Dynamics, LLC" }]
requires-python = ">=3.9"
keywords = ["agents", "skills", "reselling", "ebay", "ollama", "MCP", "LLM"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
reseller-skills = "reseller_skills.cli:main"

[tool.setuptools.packages.find]
include = ["reseller_skills*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
